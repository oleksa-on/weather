<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 600px; /* Change to 1072 if you have a Paperwhite */
    height: 800px; /* Change to 1448 if you have a Paperwhite */
    background: #ffffff;
    color: #000000;
    font-family: Arial, Helvetica, sans-serif;
    padding: 16px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  #cities {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .city-card {
    border: 2px solid #000;
    border-radius: 10px;
    padding: 10px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .left-group {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .weather-icon {
    width: 48px;
    height: 48px;
    flex-shrink: 0;
  }
  .city-name { font-size: 24px; font-weight: bold; }
  .city-desc { font-size: 15px; margin-top: 3px; }
  .temp-block { text-align: right; }
  .temp-now { font-size: 34px; font-weight: bold; }
  .temp-minmax { font-size: 14px; margin-top: 2px; }
  .footer { text-align: center; font-size: 14px; color: #333; margin-top: 6px; }
</style>
</head>
<body>

<div id="cities"></div>
<div class="footer" id="updated"></div>

<script>
const CITIES = [
  { name: "Zagreb",    lat: 45.815, lon: 15.982 },
  { name: "Kharkiv",   lat: 49.994, lon: 36.230 },
  { name: "Lutsk",     lat: 50.747, lon: 25.325 },
  { name: "Koppigen",  lat: 47.122, lon: 7.604  },
  { name: "Vienna",    lat: 48.208, lon: 16.373 },
  { name: "Mukachevo", lat: 48.441, lon: 22.718 }
];

// Crisp black-and-white SVG icons designed for E-Ink
const ICONS = {
  sun: `<svg class="weather-icon" viewBox="0 0 64 64" fill="none" stroke="#000" stroke-width="4" stroke-linecap="round">
          <circle cx="32" cy="32" r="12" fill="#000"/>
          <line x1="32" y1="6" x2="32" y2="14"/><line x1="32" y1="50" x2="32" y2="58"/>
          <line x1="6" y1="32" x2="14" y2="32"/><line x1="50" y1="32" x2="58" y2="32"/>
          <line x1="13.6" y1="13.6" x2="19.3" y2="19.3"/><line x1="44.7" y1="44.7" x2="50.4" y2="50.4"/>
          <line x1="50.4" y1="13.6" x2="44.7" y2="19.3"/><line x1="19.3" y1="44.7" x2="13.6" y2="50.4"/>
        </svg>`,
  partly: `<svg class="weather-icon" viewBox="0 0 64 64" fill="none" stroke="#000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
             <circle cx="24" cy="24" r="10" fill="#000"/>
             <line x1="24" y1="6" x2="24" y2="10"/><line x1="6" y1="24" x2="10" y2="24"/>
             <line x1="11" y1="11" x2="14" y2="14"/><line x1="37" y1="11" x2="34" y2="14"/>
             <path d="M22 48h26a10 10 0 0 0 1-19.9A14 14 0 0 0 22 30a9 9 0 0 0 0 18z" fill="#fff"/>
           </svg>`,
  cloud: `<svg class="weather-icon" viewBox="0 0 64 64" fill="none" stroke="#000" stroke-width="4" stroke-linejoin="round">
            <path d="M18 48h30a11 11 0 0 0 1.2-21.9A16 16 0 0 0 18.5 29 10 10 0 0 0 18 48z" fill="#fff"/>
          </svg>`,
  fog: `<svg class="weather-icon" viewBox="0 0 64 64" fill="none" stroke="#000" stroke-width="4" stroke-linecap="round">
          <path d="M16 34h32a9 9 0 0 0 1-17.9A13 13 0 0 0 24 18a8 8 0 0 0-8 16z"/>
          <line x1="12" y1="43" x2="52" y2="43"/><line x1="18" y1="51" x2="46" y2="51"/>
        </svg>`,
  rain: `<svg class="weather-icon" viewBox="0 0 64 64" fill="none" stroke="#000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
           <path d="M18 40h28a10 10 0 0 0 1-19.9A14 14 0 0 0 20 22a9 9 0 0 0-2 18z"/>
           <line x1="22" y1="47" x2="19" y2="55"/><line x1="32" y1="47" x2="29" y2="55"/><line x1="42" y1="47" x2="39" y2="55"/>
         </svg>`,
  snow: `<svg class="weather-icon" viewBox="0 0 64 64" fill="none" stroke="#000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
           <path d="M18 40h28a10 10 0 0 0 1-19.9A14 14 0 0 0 20 22a9 9 0 0 0-2 18z"/>
           <circle cx="22" cy="49" r="2" fill="#000"/><circle cx="32" cy="53" r="2" fill="#000"/><circle cx="42" cy="49" r="2" fill="#000"/>
         </svg>`,
  storm: `<svg class="weather-icon" viewBox="0 0 64 64" fill="none" stroke="#000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 38h28a10 10 0 0 0 1-19.9A14 14 0 0 0 20 20a9 9 0 0 0-2 18z"/>
            <polyline points="34,38 26,49 34,49 28,59"/>
          </svg>`
};

function getWeatherInfo(code) {
  if (code === 0 || code === 1) return { desc: code === 0 ? "Clear sky" : "Mainly clear", icon: ICONS.sun };
  if (code === 2) return { desc: "Partly cloudy", icon: ICONS.partly };
  if (code === 3) return { desc: "Overcast", icon: ICONS.cloud };
  if (code === 45 || code === 48) return { desc: "Fog", icon: ICONS.fog };
  if ((code >= 51 && code <= 67) || (code >= 80 && code <= 82)) return { desc: "Rain", icon: ICONS.rain };
  if ((code >= 71 && code <= 77) || (code >= 85 && code <= 86)) return { desc: "Snow", icon: ICONS.snow };
  if (code >= 95) return { desc: "Thunderstorm", icon: ICONS.storm };
  return { desc: "Cloudy", icon: ICONS.cloud };
}

async function loadWeather() {
  const container = document.getElementById("cities");
  for (const c of CITIES) {
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${c.lat}&longitude=${c.lon}&current=temperature_2m,weather_code,wind_speed_10m&daily=temperature_2m_max,temperature_2m_min&timezone=auto`;
    const res = await fetch(url);
    const data = await res.json();

    const temp = Math.round(data.current.temperature_2m);
    const max = Math.round(data.daily.temperature_2m_max[0]);
    const min = Math.round(data.daily.temperature_2m_min[0]);
    const wind = Math.round(data.current.wind_speed_10m);
    const info = getWeatherInfo(data.current.weather_code);

    container.innerHTML += `
      <div class="city-card">
        <div class="left-group">
          ${info.icon}
          <div>
            <div class="city-name">${c.name}</div>
            <div class="city-desc">${info.desc} • Wind ${wind} km/h</div>
          </div>
        </div>
        <div class="temp-block">
          <div class="temp-now">${temp > 0 ? '+' + temp : temp}°</div>
          <div class="temp-minmax">min ${min}° / max ${max}°</div>
        </div>
      </div>
    `;
  }
  const now = new Date();
  document.getElementById("updated").innerText =
    "Updated: " + now.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });
}

loadWeather();
</script>
</body>
</html>
